# Free Supabase projects are paused after 7 days without activity, which takes
# the phone/claude.ai connector offline. This sends a couple of cheap API
# requests every 3 days so the project counts as active.
#
# Setup: in GitHub, Settings → Secrets and variables → Actions, add
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key
#
# If the project is already paused this run fails, and GitHub emails you.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          url="${SUPABASE_URL%/}"
          rest=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" "$url/rest/v1/")
          health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" "$url/auth/v1/health")
          echo "rest: $rest, auth health: $health"
          if [ "$health" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $health). The project may be paused: restore it in the dashboard."
            exit 1
          fi
